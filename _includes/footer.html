<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }} &middot; {{ site.author.affiliation }}</p>
    <ul class="site-footer__links">
      <li><a href="{{ '/publications/' | relative_url }}">Publications</a></li>
      <li><a href="{{ site.author.orcid }}" rel="me">ORCID</a></li>
      <li><a href="{{ site.author.github }}" rel="me">GitHub</a></li>
      <li><a href="{{ site.author.linkedin }}" rel="me">LinkedIn</a></li>
      <li><a href="{{ '/impressum/' | relative_url }}" lang="de"{% if page.url == "/impressum/" %} aria-current="page"{% endif %}>Impressum</a></li>
    </ul>
  </div>
</footer>
