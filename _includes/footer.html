<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }} <span class="sep" aria-hidden="true">·</span> {{ site.author.affiliation }}</p>
    <ul class="inline-list" aria-label="Contact and legal">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="{{ site.author.github }}" rel="me">GitHub</a></li>
      <li><a href="{{ site.author.orcid }}" rel="me">ORCID</a></li>
      <li><a href="{{ '/impressum/' | relative_url }}" lang="de">Impressum</a></li>
    </ul>
  </div>
</footer>
